name: Deploy

on:
    workflow_dispatch:
        inputs:
            target:
                description: "Target environment"
                required: true
                default: "test"
                type: choice
                options:
                    - test
                    - production

env:
    NODE_VERSION: 22

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js ${{ env.NODE_VERSION }}.x
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}.x
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Deploy
              run: npm run deploy
              env:
                  PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
                  TARGET: ${{ github.event.inputs.target }}
